# FROZEN evaluation config v1 (2026-11-20). Identical to configs/exp_before.yaml: the unchecked-sources
# note (coverage_hint) is OFF because the before/after pilot showed no accuracy benefit.
model: qwen3:4b
temperature: 0.0
top_p: 1.0
seed: 7
num_ctx: 8192        # measured: 16384 spills to CPU on the 6 GB GPU
num_predict: 900
think: false
max_rounds: 6
max_tool_calls: 12
max_calls_per_round: 3
model_timeout_s: 240
tool_timeout_s: 10
run_timeout_s: 1200
reserve_output_tokens: 1100
reserve_instruction_tokens: 1300
coverage_hint: false
round_prompt: investigator_v2
report_prompt: report_v1
baseline_prompt: baseline_v1
