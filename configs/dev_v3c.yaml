# Development v3c (NOT the frozen evaluation): dev_v3 plus the causal-evidence gate.
model: qwen3:4b
temperature: 0.0
top_p: 1.0
seed: 7
num_ctx: 8192        # measured: 16384 spills to CPU on the 6 GB GPU
num_predict: 900
think: false
max_rounds: 6
max_tool_calls: 12
max_calls_per_round: 3
