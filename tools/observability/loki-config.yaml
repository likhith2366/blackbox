# Single-process Grafana Loki for the local BlackBox demo (no auth, local disk, 127.0.0.1 only).
#   loki-windows-amd64.exe -config.file=tools/observability/loki-config.yaml
auth_enabled: false

server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: tools/observability/data
  storage:
    filesystem:
      chunks_directory: tools/observability/data/chunks
      rules_directory: tools/observability/data/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true     # snapshot replays carry their evidence ids
  reject_old_samples: false           # snapshots keep their original (past) timestamps
  max_query_lookback: 0s
  retention_period: 0s

analytics:
  reporting_enabled: false
